[project]
name = "augur-forecast"
version = "0.1.0.dev0"
description = "A forecasting bot for Metaculus tournaments with a ledger and a backtest that cannot read the future."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "TheAsianFish" }]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.scripts]
augur = "augur.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "ASYNC", "S", "PT", "RET", "TID"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S608", "ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["augur", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a local Ollama or live credentials; skipped with the reason otherwise",
]
addopts = "-m 'not integration' --strict-markers"
filterwarnings = ["error"]
