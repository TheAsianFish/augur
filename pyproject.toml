[project]
name = "augur-forecast"
version = "0.1.0"
description = "A forecasting bot for Metaculus tournaments with a ledger and a backtest that cannot read the future."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "TheAsianFish" }]
keywords = ["forecasting", "metaculus", "llm", "prediction", "backtesting", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Metaculus's template bot, run unpublished as the shadow baseline (augur baseline).
baseline = ["forecasting-tools>=0.3.7"]

[project.urls]
Homepage = "https://github.com/TheAsianFish/augur"
Repository = "https://github.com/TheAsianFish/augur"
Issues = "https://github.com/TheAsianFish/augur/issues"
Changelog = "https://github.com/TheAsianFish/augur/blob/main/CHANGELOG.md"

[project.scripts]
augur = "augur.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur"]

# The committed sample questions, so an installed `augur forecast` without a
# token has something to dry-run on (augur/runner.py, SAMPLES_DIR).
[tool.hatch.build.targets.wheel.force-include]
"data/samples/minibench" = "augur/samples/minibench"

# The source distribution is the package, its tests and what the wheel needs:
# not the ledgers, recordings and runs under data/ (about 50 MB), nor CI.
[tool.hatch.build.targets.sdist]
include = [
    "/augur",
    "/tests",
    "/data/samples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "ASYNC", "S", "PT", "RET", "TID"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S608", "ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["augur", "tests", "scripts"]

# The optional baseline extra: untyped, and absent from the default install
# (CI), so it is treated the same whether or not it is installed.
[[tool.mypy.overrides]]
module = ["forecasting_tools", "forecasting_tools.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a local Ollama or live credentials; skipped with the reason otherwise",
]
addopts = "-m 'not integration' --strict-markers"
filterwarnings = ["error"]
