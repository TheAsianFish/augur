name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect project
        id: project
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.project.outputs.present == 'true'
        with:
          enable-cache: true
      - name: Quality gate
        if: steps.project.outputs.present == 'true'
        run: make check
