name: Tournament

# A cheap standard-library poll first; the forecast job (install, models,
# Metaculus) runs only when an open question has not been forecast yet.
# Repository variables: AUGUR_SCHEDULE (off | minibench | all; unset = off),
# AUGUR_SUBMIT ('true' to post from scheduled runs; scheduled and chained runs
# forecast only when it is set, since a dry run posts nothing, so every later
# tick would forecast the same questions again; dry runs are manual dispatches),
# AUGUR_FORECAST_MODELS, AUGUR_RESEARCH_MODELS, AUGUR_MAX_QUESTIONS_PER_RUN,
# AUGUR_MAX_COST_PER_RUN, AUGUR_CHAIN_MINUTES (the fallback trigger below; unset = off),
# AUGUR_FUTUREEVAL (the FutureEval project id; default 33121, Fall 2026),
# AUGUR_SHADOW ('true': scheduled ticks run the shadow job below instead of the
# forecast job), AUGUR_SHADOW_MODELS (the shadow route; default the free nemotron),
# AUGUR_SHADOW_DAILY_CALLS (the free calls a day the poll budgets; default 1000),
# AUGUR_SHADOW_MAX_QUESTIONS (questions a shadow tick takes; default 4).
#
# Shadow mode (M11): Augur and Metaculus's template bot forecast the same open
# questions on the same free model, and nothing is posted: no step of the shadow
# job can pass --submit, and augur forecast refuses --submit with --shadow-ledger.
# A tick's work is decided against the shadow tree of the ledger branch (the
# questions it already holds), not against Metaculus, since a dry run leaves no
# forecast there. Each tick pushes its export after Augur's forecasts and again
# after the template's, so a timeout loses neither.
#
# Cadence (RESULTS.md M3): every 90 minutes on two offset lines, which caught
# 99.25% of 3-hour MiniBench windows in simulation against the measured delays,
# for about 979 billed minutes a month while the repository is private. GitHub's
# scheduler was measured to drop most ticks on public bot repositories (median
# 6 h between scheduled runs), so the cron cannot be the only trigger: with
# AUGUR_CHAIN_MINUTES set, each run on main dispatches the next one itself after
# that many minutes. Turn it on once the repository is public (its minutes are
# then free); the cron restarts the chain if it ever breaks.

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *' # cadence: see RESULTS.md M3
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      tournament:
        description: Tournament to forecast
        type: choice
        options: [minibench, bot-testing-area, futureeval]
        default: minibench
      submit:
        description: Post forecasts and comments (from main only)
        type: boolean
        default: false
      push_ledger:
        description: Push this run's ledger export to the ledger branch
        type: boolean
        default: true
      max_questions:
        description: Questions per run at most
        type: string
        default: '6'
      chained:
        description: Dispatched by the previous run (behaves like a scheduled run)
        type: boolean
        default: false
      shadow:
        description: A shadow tick (Augur and the template, unpublished; never submits)
        type: boolean
        default: false

concurrency:
  group: tournament
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_work: ${{ steps.poll.outputs.has_work }}
      tournaments: ${{ steps.poll.outputs.tournaments }}
      shadow: ${{ env.AUGUR_SHADOW }}
    env:
      # A manual run is a shadow tick when asked; scheduled and chained runs follow the variable.
      AUGUR_SHADOW: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.chained) && inputs.shadow || (!(github.event_name == 'workflow_dispatch' && !inputs.chained) && vars.AUGUR_SHADOW == 'true')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/poll.py
            scripts/shadow_fetch.sh
          sparse-checkout-cone-mode: false
      - name: Read the shadow ledger from the ledger branch
        if: env.AUGUR_SHADOW == 'true'
        run: bash scripts/shadow_fetch.sh shadow-ledger
      - name: Poll for open questions not yet forecast
        id: poll
        env:
          AUGUR_SHADOW_LEDGER: shadow-ledger/shadow
          AUGUR_SHADOW_DAILY_CALLS: ${{ vars.AUGUR_SHADOW_DAILY_CALLS }}
          AUGUR_MAX_QUESTIONS_PER_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained && inputs.max_questions) || (env.AUGUR_SHADOW == 'true' && (vars.AUGUR_SHADOW_MAX_QUESTIONS || '4')) || vars.AUGUR_MAX_QUESTIONS_PER_RUN || '6' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          # Scheduled runs obey the variable (unset or 'off' is the kill switch);
          # a manual run polls the tournament it was asked for.
          AUGUR_SCHEDULE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && 'all' || vars.AUGUR_SCHEDULE || 'off' }}
          AUGUR_POLL_TOURNAMENTS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && (inputs.tournament == 'futureeval' && (vars.AUGUR_FUTUREEVAL || '33121') || inputs.tournament) || '' }}
          # The FutureEval project 'all' polls: 33121 is Fall 2026; set the Spring 2027 id.
          AUGUR_FUTUREEVAL: ${{ vars.AUGUR_FUTUREEVAL }}
        run: python3 scripts/poll.py

  forecast:
    needs: poll
    # A scheduled dry run would never leave a forecast on Metaculus, so the
    # poll would find the same questions on every tick and bill a forecast job
    # each time: scheduled and chained runs forecast only when they post.
    # Shadow mode is checked twice: the poll's output, and for scheduled and chained
    # runs the variable itself, so an empty output can never fall through to posting.
    if: >-
      needs.poll.outputs.has_work == 'true' && needs.poll.outputs.shadow == 'false' &&
      ((github.event_name == 'workflow_dispatch' && !inputs.chained && !inputs.shadow) ||
       (vars.AUGUR_SUBMIT == 'true' && vars.AUGUR_SHADOW != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # the ledger branch push
    env:
      AUGUR_LEDGER: run.sqlite
      AUGUR_LOG_LEVEL: INFO
      AUGUR_FORECAST_MODELS: ${{ vars.AUGUR_FORECAST_MODELS }}
      AUGUR_RESEARCH_MODELS: ${{ vars.AUGUR_RESEARCH_MODELS }}
      AUGUR_MAX_QUESTIONS_PER_RUN: ${{ inputs.max_questions || vars.AUGUR_MAX_QUESTIONS_PER_RUN || '6' }}
      AUGUR_MAX_COST_PER_RUN: ${{ vars.AUGUR_MAX_COST_PER_RUN || '1.00' }}
      # Stop starting questions well inside the job's 40-minute timeout; the
      # forecast step splits it between the tournaments it runs.
      RUN_MINUTES: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked --no-dev
      - name: Forecast
        id: forecast
        continue-on-error: true
        env:
          # Secrets only on this step, not while dependencies install.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_CLIENT_SECRET: ${{ secrets.ASKNEWS_CLIENT_SECRET }}
          TOURNAMENTS: ${{ needs.poll.outputs.tournaments }}
          # Posting needs the switch for this kind of run, and main (which passed make check).
          SUBMIT: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && !inputs.chained && inputs.submit) || ((github.event_name == 'schedule' || inputs.chained) && vars.AUGUR_SUBMIT == 'true')) }}
        run: |
          set -o pipefail
          args=()
          if [ "$SUBMIT" = "true" ]; then args+=(--submit); fi
          status=0
          : > run.txt
          IFS=',' read -ra tournaments <<< "$TOURNAMENTS"
          export AUGUR_RUN_DEADLINE_MINUTES=$(( RUN_MINUTES / (${#tournaments[@]} > 0 ? ${#tournaments[@]} : 1) ))
          for t in "${tournaments[@]}"; do
            case "$t" in
              ''|*[!a-z0-9-]*) echo "refusing tournament name '$t'" | tee -a run.txt; status=1; continue ;;
            esac
            echo "== augur forecast --tournament $t ${args[*]}" | tee -a run.txt
            uv run --no-sync augur forecast --tournament "$t" "${args[@]}" \
              --coverage "coverage-$t.json" 2>&1 | tee -a run.txt || status=1
          done
          exit "$status"
      - name: Push the ledger export to the ledger branch
        if: always() && (github.event_name == 'schedule' || inputs.chained || inputs.push_ledger)
        run: bash scripts/push_ledger.sh run.sqlite run.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Tournament run (${{ github.event_name }}, forecast ${{ steps.forecast.outcome }})"
            echo '```'
            if [ -f run.txt ]; then tail -n 40 run.txt; else echo "no output"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if the forecast failed
        if: steps.forecast.outcome == 'failure'
        run: |
          echo "the forecast step failed; its output is in the step summary"
          exit 1

  # M11's shadow tick. Nothing here can post: no step passes --submit, the
  # SUBMIT switch is not read, and augur forecast refuses --submit with
  # --shadow-ledger. Measured on the bot-testing-area (RESULTS.md M11): about 2
  # minutes and 7 calls a question for Augur, 2 minutes and 15 calls for the
  # template, so a tick takes 4 questions by default; Augur's step stops starting
  # questions at 14 minutes, the template's at 11.
  shadow:
    needs: poll
    if: needs.poll.outputs.has_work == 'true' && needs.poll.outputs.shadow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the ledger branch push
    env:
      AUGUR_LEDGER: run.sqlite
      AUGUR_LOG_LEVEL: INFO
      # The free route both contestants use; a repository variable may name another.
      AUGUR_FORECAST_MODELS: ${{ vars.AUGUR_SHADOW_MODELS || 'openrouter:nvidia/nemotron-3-ultra-550b-a55b:free' }}
      AUGUR_RESEARCH_MODELS: ${{ vars.AUGUR_SHADOW_MODELS || 'openrouter:nvidia/nemotron-3-ultra-550b-a55b:free' }}
      # A chained dispatch carries max_questions' default; only a person's dispatch sets it.
      AUGUR_MAX_QUESTIONS_PER_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained && inputs.max_questions) || vars.AUGUR_SHADOW_MAX_QUESTIONS || '4' }}
      AUGUR_MAX_COST_PER_RUN: '0.00'
      RUN_MINUTES: '14'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install, with the template bot
        run: uv sync --locked --no-dev --extra baseline
      - name: Name this tick
        run: echo "SHADOW_NAME=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Rebuild the shadow ledger from the ledger branch
        run: |
          bash scripts/shadow_fetch.sh shadow-ledger
          if [ -n "$(find shadow-ledger -name '*.jsonl' -print -quit)" ]; then
            uv run --no-sync augur ledger import shadow-ledger/shadow --out shadow.sqlite
          else
            echo "no shadow exports yet: nothing is held"
          fi
      - name: Forecast (shadow, never submitted)
        id: forecast
        continue-on-error: true
        timeout-minutes: 17
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_CLIENT_SECRET: ${{ secrets.ASKNEWS_CLIENT_SECRET }}
          TOURNAMENTS: ${{ needs.poll.outputs.tournaments }}
        run: |
          set -o pipefail
          status=0
          : > run.txt
          IFS=',' read -ra tournaments <<< "$TOURNAMENTS"
          export AUGUR_RUN_DEADLINE_MINUTES=$(( RUN_MINUTES / (${#tournaments[@]} > 0 ? ${#tournaments[@]} : 1) ))
          for t in "${tournaments[@]}"; do
            case "$t" in
              ''|*[!a-z0-9-]*) echo "refusing tournament name '$t'" | tee -a run.txt; status=1; continue ;;
            esac
            echo "== augur forecast --tournament $t --shadow-ledger shadow.sqlite" | tee -a run.txt
            uv run --no-sync augur forecast --tournament "$t" --shadow-ledger shadow.sqlite \
              --coverage "coverage-$t.json" 2>&1 | tee -a run.txt || status=1
          done
          exit "$status"
      - name: Push Augur's forecasts to the ledger branch
        if: always()
        run: bash scripts/push_shadow.sh run.sqlite run.txt "$SHADOW_NAME"
      - name: Template bot on the same questions (unpublished)
        id: template
        if: always()
        continue-on-error: true
        timeout-minutes: 14
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_CLIENT_SECRET: ${{ secrets.ASKNEWS_CLIENT_SECRET }}
        run: |
          set -o pipefail
          if [ ! -f run.sqlite ]; then echo "no run ledger: nothing for the template" | tee -a run.txt; exit 0; fi
          echo "== augur baseline --ledger run.sqlite --shadow-ledger shadow.sqlite" | tee -a run.txt
          uv run --no-sync augur baseline --ledger run.sqlite --shadow-ledger shadow.sqlite \
            --max-minutes 11 2>&1 | tee -a run.txt
      - name: Push the template's forecasts to the ledger branch
        if: always()
        run: bash scripts/push_shadow.sh run.sqlite run.txt "$SHADOW_NAME"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Shadow tick (${{ github.event_name }}, forecast ${{ steps.forecast.outcome }}, template ${{ steps.template.outcome }})"
            echo '```'
            if [ -f run.txt ]; then tail -n 60 run.txt; else echo "no output"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if a step failed
        if: steps.forecast.outcome == 'failure' || steps.template.outcome == 'failure'
        run: |
          echo "the forecast or template step failed; its output is in the step summary"
          exit 1

  # The fallback trigger: GitHub's scheduler drops most ticks (RESULTS.md M3),
  # but a workflow_dispatch sent with the job's own token always starts a run.
  # At most one chain: nothing is dispatched while another run is queued.
  # Never on a private repository, where the wait would bill all day.
  chain:
    needs: [poll, forecast, shadow]
    if: >-
      always() && vars.AUGUR_CHAIN_MINUTES != '' &&
      github.event.repository.private == false &&
      (vars.AUGUR_SCHEDULE == 'minibench' || vars.AUGUR_SCHEDULE == 'all') &&
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.chained)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      MINUTES: ${{ vars.AUGUR_CHAIN_MINUTES }}
    steps:
      - name: Wait, then dispatch the next run unless one is already waiting
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "AUGUR_CHAIN_MINUTES must be whole minutes"; exit 1 ;; esac
          if [ "$MINUTES" -lt 10 ] || [ "$MINUTES" -gt 110 ]; then echo "AUGUR_CHAIN_MINUTES must be 10 to 110"; exit 1; fi
          sleep $((MINUTES * 60))
          # A run held by the concurrency group is "pending"; one not yet started is "queued".
          for status in queued pending waiting; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tournament.yml --status "$status" --json databaseId --jq length)
            if [ "$n" != "0" ]; then echo "a run is already $status; it continues the chain"; exit 0; fi
          done
          gh workflow run tournament.yml -R "$GITHUB_REPOSITORY" --ref main -f chained=true
          echo "dispatched the next run"
